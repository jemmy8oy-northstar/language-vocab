server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /language-vocab {
        return 301 /language-vocab/;
    }

    location /language-vocab/ {
        try_files $uri /language-vocab/index.html;
    }

    # Optional: cache static files aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires max;
        log_not_found off;
    }
}
